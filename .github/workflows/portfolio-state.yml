name: Portfolio state maintenance

on:
  schedule:
    # UTC+3: check from 06:07 through 23:47, including recovery opportunities.
    - cron: '7,27,47 3-20 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/portfolio-state.yml'
      - '.github/scripts/run_private.py'
      - '.github/scripts/portfolio-state.enc'

permissions:
  contents: read

concurrency:
  group: portfolio-state-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: Europe/Istanbul
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare cryptographic runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/portfolio-runtime"
          "$RUNNER_TEMP/portfolio-runtime/bin/python" -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - name: Configure commit identity
        run: |
          git config user.name 'mo'
          git config user.email 'm.demir.0304@gmail.com'
      - name: Validate and execute private package
        env:
          PORTFOLIO_SCRIPT_KEY: ${{ secrets.PORTFOLIO_SCRIPT_KEY }}
        run: '"$RUNNER_TEMP/portfolio-runtime/bin/python" -B .github/scripts/run_private.py'
